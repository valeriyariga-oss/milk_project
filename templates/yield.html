{% extends "base.html" %}
{% block title %}Внести надой{% endblock %}
{% block content %}
<a href="/" class="back">← Главная</a>

<p class="eyebrow">ПЕРВИЧНЫЕ ДАННЫЕ</p>
<h1>Внести надой</h1>
<p class="muted">Запись сохранится в таблице milk_yield.</p>

<form method="POST" class="form">
    <label>
        Дата
        <input type="date" name="date_yield" value="{{ today }}" required>
    </label>

    <label>
        Смена
        <select name="shift" required>
            <option value="Утро">Утро</option>
            <option value="День">День</option>
            <option value="Вечер">Вечер</option>
        </select>
    </label>

    <label>
        Корова (по бирке)
        <select name="animal_id">
            <option value="">— Выберите корову —</option>
            {% for a in refs.animals %}
            <option value="{{ a.animal_id }}">{{ a.label }} ({{ a.status }})</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Или группа
        <select name="group_id">
            <option value="">— Выберите группу —</option>
            {% for g in refs.groups %}
            <option value="{{ g.group_id }}">{{ g.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Объём, литров
        <input type="number" step="0.01" name="volume_liters" required>
    </label>

    <label>
        Кто внёс запись
        <select name="user_id">
            <option value="">— Не указан —</option>
            {% for u in refs.users %}
            <option value="{{ u.user_id }}">{{ u.full_name }} · {{ u.role }}</option>
            {% endfor %}
        </select>
    </label>

    <button type="submit">Сохранить надой</button>
</form>

<p class="note" style="margin-top:20px;">
    <strong>Важно:</strong> выберите либо корову, либо группу. Одновременно оба поля быть заполненными не могут.
</p>
{% endblock %}

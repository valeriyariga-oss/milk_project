{% extends "base.html" %}
{% block title %}Движение молока{% endblock %}
{% block content %}
<a href="/" class="back">← Главная</a>

<p class="eyebrow">ПРИХОД И РАСХОД</p>
<h1>Движение молока</h1>
<p class="muted">Фиксируйте расход, чтобы автоматически считать остатки и формировать СП-23.</p>

<form method="POST" class="form">
    <label>
        Дата операции
        <input type="date" name="date_movement" value="{{ today }}" required>
    </label>

    <label>
        Тип операции
        <select name="movement_type" required>
            <option value="Приход">Приход</option>
            <option value="Расход">Расход</option>
        </select>
    </label>

    <label>
        Направление расхода
        <select name="direction">
            <option value="">— Выберите направление —</option>
            <option value="Отгрузка на завод">Отгрузка на завод</option>
            <option value="Переработка">Переработка</option>
            <option value="Выпойка телят">Выпойка телят</option>
            <option value="Столовая">Столовая</option>
        </select>
    </label>

    <label>
        Объём, литров
        <input type="number" step="0.01" name="volume_liters" required>
    </label>

    <label>
        Комментарий
        <input type="text" name="comment">
    </label>

    <label>
        Кто внёс запись
        <select name="user_id">
            <option value="">— Не указан —</option>
            {% for u in refs.users %}
            <option value="{{ u.user_id }}">{{ u.full_name }} · {{ u.role }}</option>
            {% endfor %}
        </select>
    </label>

    <button type="submit">Сохранить движение</button>
</form>
{% endblock %}
